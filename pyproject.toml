[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccgp"
version = "0.1.0"
description = "Correlation-consistent genomic prediction: standardized-MSE Pearson loss, affine calibration, and selection-aware evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CCGP authors" }]
keywords = ["genomic-prediction", "genomic-selection", "deep-learning", "pearson-loss", "calibration", "plant-breeding"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "xgboost>=2.0",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyarrow>=14",
  "requests>=2.31",
  "appdirs>=1.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ccgp = "ccgp.cli:main"

[tool.setuptools]
packages = ["ccgp", "ccgp.models"]

[tool.ruff]
line-length = 110
